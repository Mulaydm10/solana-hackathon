<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Procurement Layer</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1b1b1a; --muted: #6b6a66; --line: #e3e1da;
    --accent: #5b3df5; --accent-ink: #ffffff; --ok: #157347; --warn-bg: #fff4dc; --warn-ink: #7a4d00;
    --chip: #efede6; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121211; --panel: #1c1c1a; --ink: #ecebe6; --muted: #a09e97; --line: #2f2e2b;
      --accent: #8b75ff; --accent-ink: #0d0b1a; --ok: #4cc38a; --warn-bg: #3a2c0f; --warn-ink: #f3c56b; --chip: #26251f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 80px; }
  header h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); margin-left: 6px; vertical-align: middle; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-top: 16px; }
  section[hidden] { display: none; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 12px; }
  h2 b { color: var(--accent); margin-right: 6px; }
  textarea { width: 100%; min-height: 80px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit; background: var(--bg); color: var(--ink); }
  input[type=number] { width: 90px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; background: var(--bg); color: var(--ink); }
  button { font: inherit; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.ghost { background: var(--chip); color: var(--ink); font-weight: 500; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .chips button { background: var(--chip); color: var(--ink); font-weight: 400; font-size: 13px; padding: 6px 10px; }
  .options { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .opt { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .opt.chosen { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .opt .name { font-weight: 600; } .opt .why { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .summary { font-size: 17px; line-height: 1.55; margin: 0 0 8px; }
  .fields { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
  .fields label { display: flex; gap: 8px; align-items: center; }
  .refusal { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 14px; }
  .refusal code { font-family: var(--mono); font-weight: 700; }
  .status { display: inline-block; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--chip); }
  .status.Released, .status.Claimed { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .status.Refunded { background: var(--warn-bg); color: var(--warn-ink); }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 4px 12px; font-size: 14px; margin-top: 12px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
  ol.log { padding-left: 18px; margin: 12px 0 0; font-size: 14px; } ol.log a { color: var(--accent); }
  pre.delivery { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 13px; max-height: 260px; overflow: auto; }
  .muted { color: var(--muted); font-size: 13px; }
  .spin::after { content: " …"; }
  @media (max-width: 520px) { .kv { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Procurement Layer <span class="tag" id="cluster">devnet</span></h1>
    <p>The AI writes the terms; Solana enforces them. Describe a need, approve the deal, and a Solana program holds the money until delivery.</p>
  </header>

  <section id="ask">
    <h2><b>1</b>Ask</h2>
    <textarea id="request" placeholder="e.g. Translate my 2-page supplier contract from German to English within 2 hours, under 10 USDC"></textarea>
    <div class="row chips" id="examples"></div>
    <div class="row"><button id="draftBtn">Find a service &amp; draft terms</button><span class="muted" id="draftNote"></span></div>
  </section>

  <section id="find" hidden>
    <h2><b>2</b>Find</h2>
    <div class="options" id="options"></div>
  </section>

  <section id="terms" hidden>
    <h2><b>3</b>Approve terms</h2>
    <p class="summary" id="summary"></p>
    <div class="fields">
      <label>Deliver within <input type="number" id="deadlineMins" min="1"> min</label>
      <label>Review window <input type="number" id="reviewMins" min="0"> min</label>
      <label>Budget <input type="number" id="budget" min="0" step="0.01"> <span id="sym">USDC</span></label>
    </div>
    <div class="row"><button id="lockBtn">Approve &amp; lock in escrow</button><span class="muted">One Solana transaction creates the deal and moves the money.</span></div>
    <div id="lockRefusal"></div>
  </section>

  <section id="deal" hidden>
    <h2><b>4</b>Deal on Solana</h2>
    <div>Status: <span class="status" id="status">…</span> <span class="muted" id="clock"></span></div>
    <dl class="kv" id="kv"></dl>
    <div class="row">
      <button id="deliverBtn" class="ghost">Seller delivers</button>
      <button id="releaseBtn">Release payment</button>
      <button id="refundBtn" class="ghost">Refund (after deadline)</button>
      <button id="claimBtn" class="ghost">Seller claims (after review)</button>
    </div>
    <div id="dealRefusal"></div>
    <div id="deliveryBox" hidden><h2 style="margin-top:16px">Delivery</h2><pre class="delivery" id="delivery"></pre></div>
    <ol class="log" id="log"></ol>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const EXAMPLES = [
  "Translate my 2-page supplier contract from German to English within 2 hours, under 10 USDC",
  "Market research report on European battery suppliers by tomorrow, under 20 USDC",
  "Market research report on battery suppliers, under 10 USDC",
  "A price list of the top 20 GPUs as a CSV within 5 minutes",
];
let cfg, services = [], draft, deal, deadline = 0, reviewEnd = 0, onChain;

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  return res.json();
}
function refusal(el, r) {
  el.innerHTML = r && !r.ok ? `<div class="refusal">Refused: <code>${r.reason}</code> — ${escapeHtml(r.message || "")}</div>` : "";
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
async function busy(btn, fn) { btn.disabled = true; btn.classList.add("spin"); try { return await fn(); } finally { btn.disabled = false; btn.classList.remove("spin"); } }
const fmt = (units) => (Number(units) / 10 ** cfg.decimals).toString();

EXAMPLES.forEach((e) => { const b = document.createElement("button"); b.textContent = e; b.onclick = () => ($("request").value = e); $("examples").append(b); });

$("draftBtn").onclick = () => busy($("draftBtn"), async () => {
  const r = await api("/api/draft", { request: $("request").value });
  if (!r.ok) return refusal($("lockRefusal"), r);
  draft = r;
  $("draftNote").textContent = r.source === "claude" ? "Drafted by Claude" : "Drafted by the rule-based parser (no API key)";
  $("options").innerHTML = r.options.map((o) => {
    const s = services.find((x) => x.id === o.serviceId);
    return `<div class="opt ${o.serviceId === r.service.id ? "chosen" : ""}"><div class="name">${escapeHtml(s.name)} · ${s.priceUsdc} ${cfg.symbol}</div><div class="why">${escapeHtml(o.why)}</div></div>`;
  }).join("");
  $("deadlineMins").value = Math.round((r.terms.deadline - Date.now() / 1000) / 60);
  $("reviewMins").value = Math.round(r.terms.reviewSecs / 60);
  $("budget").value = r.budgetUsdc;
  $("summary").textContent = r.summary;
  $("lockRefusal").innerHTML = "";
  $("find").hidden = $("terms").hidden = false;
});

async function currentTerms() {
  const t = { ...draft.terms };
  t.deadline = Math.floor(Date.now() / 1000) + Math.max(1, Number($("deadlineMins").value)) * 60;
  t.reviewSecs = Math.max(0, Number($("reviewMins").value)) * 60;
  return t;
}
for (const id of ["deadlineMins", "reviewMins"]) $(id).oninput = async () => {
  const r = await api("/api/describe", { terms: await currentTerms() });
  if (r.ok) $("summary").textContent = r.summary;
};

$("lockBtn").onclick = () => busy($("lockBtn"), async () => {
  const terms = await currentTerms();
  const r = await api("/api/lock", { terms, budgetUsdc: Number($("budget").value) });
  refusal($("lockRefusal"), r);
  if (!r.ok) return;
  deal = r.deal;
  $("deal").hidden = false;
  $("deliveryBox").hidden = true;
  await refresh();
  $("deal").scrollIntoView({ behavior: "smooth" });
});

async function act(btn, step) {
  await busy(btn, async () => {
    const r = await api(`/api/deals/${deal}/${step}`, {});
    refusal($("dealRefusal"), r);
    if (r.ok && r.delivery) { $("delivery").textContent = r.delivery; $("deliveryBox").hidden = false; }
    await refresh();
  });
}
$("deliverBtn").onclick = () => act($("deliverBtn"), "deliver");
$("releaseBtn").onclick = () => act($("releaseBtn"), "release");
$("refundBtn").onclick = () => act($("refundBtn"), "refund");
$("claimBtn").onclick = () => act($("claimBtn"), "claim");

async function refresh() {
  const r = await api(`/api/deals/${deal}`);
  if (!r.ok || !r.onChain) return;
  onChain = r.onChain;
  deadline = onChain.deadline;
  reviewEnd = onChain.deliveredAt ? onChain.deliveredAt + onChain.reviewSecs : 0;
  $("status").textContent = onChain.status;
  $("status").className = "status " + onChain.status;
  const ex = (a) => `https://explorer.solana.com/address/${a}?cluster=${cfg.cluster}`;
  $("kv").innerHTML = [
    ["Deal account", `<a href="${ex(onChain.address)}" target="_blank">${onChain.address}</a>`],
    ["Escrowed", `${fmt(onChain.amount)} ${cfg.symbol}`],
    ["Seller", onChain.seller],
    ["Deadline", new Date(onChain.deadline * 1000).toLocaleString()],
    ["Terms hash", onChain.termsHash],
    ["Delivery hash", /^0+$/.test(onChain.deliveryHash) ? "—" : onChain.deliveryHash],
  ].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  $("log").innerHTML = r.log.map((l) => `<li>${l.step}: <a href="${l.explorer}" target="_blank">${l.signature.slice(0, 20)}…</a></li>`).join("");
  if (r.delivery) { $("delivery").textContent = r.delivery; $("deliveryBox").hidden = false; }
  tick();
}

function tick() {
  if (!onChain) return;
  const now = Date.now() / 1000;
  const s = onChain.status;
  $("deliverBtn").disabled = s !== "Funded" || now > deadline;
  $("releaseBtn").disabled = s !== "Delivered";
  $("refundBtn").disabled = s !== "Funded" || now <= deadline;
  $("claimBtn").disabled = s !== "Delivered" || now < reviewEnd;
  const left = (t) => { const d = Math.max(0, Math.round(t - now)); return `${Math.floor(d / 60)}m ${d % 60}s`; };
  $("clock").textContent = s === "Funded" ? (now <= deadline ? `· delivery due in ${left(deadline)}` : "· deadline passed — refund available")
    : s === "Delivered" ? (now < reviewEnd ? `· buyer review ends in ${left(reviewEnd)}` : "· review window over — seller may claim") : "";
}
setInterval(tick, 1000);

(async () => {
  cfg = await api("/api/config");
  services = await api("/api/services");
  $("cluster").textContent = cfg.cluster;
  $("sym").textContent = cfg.symbol;
})();
</script>
</body>
</html>
