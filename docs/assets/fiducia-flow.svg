<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-label="How a deal flows on Solana: attested listing, buyer budget, escrow, sealed key, release to the seller">
  <style>
    text { font-family: Helvetica, Arial, sans-serif }
    .lbl { font-size: 15px; fill: #8A97A8; letter-spacing: 3px; font-weight: 700 }
    .ttl { font-size: 24px; fill: #F5F1E8; font-weight: 700 }
    .sub { font-size: 15px; fill: #BFC9D6 }
    .mono { font-family: 'Courier New', monospace; font-size: 14px; fill: #2DD4BF }
    .card { fill: #16243A; stroke: #2A3D5A; stroke-width: 1.5 }
    .lit { animation: lit 10s infinite }
    .l1 { animation-delay: 0s } .l2 { animation-delay: 2s } .l3 { animation-delay: 4s } .l4 { animation-delay: 6s } .l5 { animation-delay: 8s }
    @keyframes lit { 0% { stroke: #E8B04B; stroke-width: 3 } 18% { stroke: #E8B04B; stroke-width: 3 } 22%,100% { stroke: #2A3D5A; stroke-width: 1.5 } }
    .rail { stroke: #2A3D5A; stroke-width: 3; stroke-dasharray: 6 8; animation: rail 1.2s linear infinite }
    @keyframes rail { to { stroke-dashoffset: -14 } }
    .coin { animation: travel 10s cubic-bezier(.6,0,.4,1) infinite }
    @keyframes travel {
      0%   { transform: translateX(0px) }
      20%  { transform: translateX(248px) }
      40%  { transform: translateX(496px) }
      60%  { transform: translateX(744px) }
      80%  { transform: translateX(992px) }
      95%  { transform: translateX(992px); opacity: 1 }
      100% { transform: translateX(992px); opacity: 0 }
    }
    .ok { opacity: 0; animation: ok 10s infinite }
    .o1 { animation-delay: 1.6s } .o2 { animation-delay: 3.6s } .o3 { animation-delay: 5.6s } .o4 { animation-delay: 7.6s } .o5 { animation-delay: 9.2s }
    @keyframes ok { 0% { opacity: 0 } 3% { opacity: 1 } 70% { opacity: 1 } 80%,100% { opacity: 0 } }
  </style>
  <rect width="1280" height="330" rx="18" fill="#0E1726"/>
  <text x="40" y="44" class="lbl">HOW A DEAL FLOWS · EVERY STEP CHECKED BY THE PROGRAM</text>

  <line x1="134" y1="172" x2="1146" y2="172" class="rail"/>

  <!-- step cards -->
  <g><rect class="card lit l1" x="40"   y="80" width="188" height="184" rx="16"/>
    <text x="60" y="114" class="lbl" fill="#E8B04B">01</text><text x="60" y="210" class="ttl">Attested</text><text x="60" y="234" class="sub">grade hash on chain</text></g>
  <g><rect class="card lit l2" x="288"  y="80" width="188" height="184" rx="16"/>
    <text x="308" y="114" class="lbl">02</text><text x="308" y="210" class="ttl">Budget</text><text x="308" y="234" class="sub">BuyerPolicy checked</text></g>
  <g><rect class="card lit l3" x="536"  y="80" width="188" height="184" rx="16"/>
    <text x="556" y="114" class="lbl">03</text><text x="556" y="210" class="ttl">Escrow</text><text x="556" y="234" class="sub">USDC in program vault</text></g>
  <g><rect class="card lit l4" x="784"  y="80" width="188" height="184" rx="16"/>
    <text x="804" y="114" class="lbl">04</text><text x="804" y="210" class="ttl">Sealed key</text><text x="804" y="234" class="sub">data == content hash</text></g>
  <g><rect class="card lit l5" x="1032" y="80" width="208" height="184" rx="16"/>
    <text x="1052" y="114" class="lbl">05</text><text x="1052" y="210" class="ttl">Released</text><text x="1052" y="234" class="sub">vault → seller</text></g>

  <!-- checkmarks -->
  <text x="190" y="116" class="mono ok o1">✓</text>
  <text x="438" y="116" class="mono ok o2">✓</text>
  <text x="686" y="116" class="mono ok o3">✓</text>
  <text x="934" y="116" class="mono ok o4">✓</text>
  <text x="1202" y="116" class="mono ok o5">✓</text>

  <!-- travelling USDC coin -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;248 0;248 0;496 0;496 0;744 0;744 0;992 0;992 0;992 0" keyTimes="0;.15;.2;.35;.4;.55;.6;.75;.95;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;.95;1" dur="10s" repeatCount="indefinite"/>
    <circle cx="134" cy="172" r="22" fill="#2775CA" stroke="#F5F1E8" stroke-width="2"/>
    <text x="134" y="177" text-anchor="middle" font-size="11" font-weight="700" fill="#F5F1E8">USDC</text>
  </g>

  <text x="40" y="304" class="mono">deal_escrow · CfD43mq2P1mVVpKxueo1XDe6UrQBCF3DZjNmDGQNVGSV · devnet · no delivery, no payment · no attestation, no grade</text>
</svg>
