<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Fiducia: trust, enforced on Solana">
  <style>
    .tick { font: 15px 'Courier New', monospace; fill: #2DD4BF; opacity: .18 }
    .spin { transform-origin: 1030px 200px; animation: spin 24s linear infinite }
    .spinr { transform-origin: 1030px 200px; animation: spin 40s linear infinite reverse }
    .pulse { transform-origin: 1030px 200px; animation: pulse 3.2s ease-in-out infinite }
    .shield { stroke-dasharray: 340; stroke-dashoffset: 340; animation: draw 1.6s .3s ease-out forwards }
    .check { stroke-dasharray: 70; stroke-dashoffset: 70; animation: draw .7s 1.7s ease-out forwards }
    .fade1 { opacity: 0; animation: up .9s .2s ease-out forwards }
    .fade2 { opacity: 0; animation: up .9s .6s ease-out forwards }
    .fade3 { opacity: 0; animation: up .9s 1.0s ease-out forwards }
    .fade4 { opacity: 0; animation: up .9s 1.4s ease-out forwards }
    .scroll { animation: scroll 38s linear infinite }
    .glow { animation: glow 3.2s ease-in-out infinite }
    .dot { animation: blink 1.4s ease-in-out infinite }
    @keyframes spin { to { transform: rotate(360deg) } }
    @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.035) } }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    @keyframes up { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes scroll { from { transform: translateX(0) } to { transform: translateX(-1400px) } }
    @keyframes glow { 0%,100% { opacity: .35 } 50% { opacity: .8 } }
    @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  </style>
  <defs>
    <radialGradient id="bg" cx="78%" cy="45%" r="75%">
      <stop offset="0" stop-color="#1C2F4A"/>
      <stop offset="1" stop-color="#0E1726"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8B04B"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- scrolling on-chain ticker -->
  <g class="scroll">
    <text class="tick" x="0" y="40">create_listing 6X3v…xJod ✓ · attest_listing grade=A ✓ · create_deal 2.00 USDC → escrow ✓ · submit_delivery hash=match ✓ · release vault → seller ✓ · create_mission + fee ✓ · add_mandate cap=5 ✓ · approve_stage plan=d169… ✓ · agent_spend 1.00 USDC ✓ · revoke_mandate ✓ ·</text>
    <text class="tick" x="1400" y="40">create_listing 6X3v…xJod ✓ · attest_listing grade=A ✓ · create_deal 2.00 USDC → escrow ✓ · submit_delivery hash=match ✓ · release vault → seller ✓ · create_mission + fee ✓ · add_mandate cap=5 ✓ · approve_stage plan=d169… ✓ · agent_spend 1.00 USDC ✓ · revoke_mandate ✓ ·</text>
    <text class="tick" x="-300" y="372">settle() conservation ✓ · BuyerPolicy max=50 · Mandate payees=1 stage=0b01 · SellerRep 10 deals / 3 buyers · x402 pay-per-call 0.01 USDC · no answer → no charge · DealLink content hash ✓ · AssessorRegistry ✓ ·</text>
    <text class="tick" x="1100" y="372">settle() conservation ✓ · BuyerPolicy max=50 · Mandate payees=1 stage=0b01 · SellerRep 10 deals / 3 buyers · x402 pay-per-call 0.01 USDC · no answer → no charge · DealLink content hash ✓ · AssessorRegistry ✓ ·</text>
  </g>

  <!-- seal -->
  <circle cx="1030" cy="200" r="190" fill="url(#halo)" class="glow"/>
  <g class="spinr"><circle cx="1030" cy="200" r="170" fill="none" stroke="url(#ring)" stroke-width="1.5" stroke-dasharray="1 9" opacity=".6"/></g>
  <g class="spin">
    <circle cx="1030" cy="200" r="140" fill="none" stroke="url(#ring)" stroke-width="2" stroke-dasharray="40 14" opacity=".75"/>
    <circle cx="1170" cy="200" r="6" fill="#E8B04B"/>
  </g>
  <g class="pulse">
    <circle cx="1030" cy="200" r="108" fill="none" stroke="url(#ring)" stroke-width="7"/>
    <circle cx="1030" cy="200" r="76" fill="#16243A" stroke="#E8B04B" stroke-width="1.5"/>
  </g>
  <path class="shield" d="M1030 148 L1068 164 L1068 200 C1068 226 1051 245 1030 254 C1009 245 992 226 992 200 L992 164 Z" fill="none" stroke="#E8B04B" stroke-width="5" stroke-linejoin="round"/>
  <path class="check" d="M1011 202 L1025 216 L1052 187" fill="none" stroke="#2DD4BF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- words -->
  <g class="fade1"><text x="80" y="108" fill="#E8B04B" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="5">SUPERTEAM GERMANY × WHU 2026 · SOLANA DEVNET</text></g>
  <g class="fade2"><text x="76" y="225" fill="#F5F1E8" font-family="Georgia, 'Times New Roman', serif" font-size="128" font-weight="700" letter-spacing="-2">Fiducia</text></g>
  <g class="fade3"><text x="80" y="285" fill="#F5F1E8" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic">Trust, enforced on Solana.</text></g>
  <g class="fade4">
    <circle class="dot" cx="88" cy="328" r="6" fill="#2DD4BF"/>
    <text x="104" y="335" fill="#BFC9D6" font-family="Helvetica, Arial, sans-serif" font-size="21">Live on devnet · buy data, services and whole AI agent teams; the chain enforces every rule.</text>
  </g>
</svg>
